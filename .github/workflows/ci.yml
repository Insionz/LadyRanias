# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # Azurite støtter ikke API-versjonen til Azure.Storage.Blobs ennå (november 2026).
    # --skipApiVersionCheck kan fjernes når en nyere Azurite er ute.
    - name: Start Azurite
      run: >
        docker run -d -p 10000:10000 -p 10001:10001 -p 10002:10002
        mcr.microsoft.com/azure-storage/azurite
        azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal
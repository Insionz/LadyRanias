name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # .NET: bygg og kjør alle testene (mot Azurite)
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # Azurite støtter ikke API-versjonen til Azure.Storage.Blobs ennå (november 2026).
    # --skipApiVersionCheck kan fjernes når en nyere Azurite er ute.
    - name: Start Azurite
      run: >
        docker run -d -p 10000:10000 -p 10001:10001 -p 10002:10002
        mcr.microsoft.com/azure-storage/azurite
        azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal

  # React: lint og bygg. Kjører samtidig med .NET-jobben.
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/LadyRanias.App/ClientApp

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: src/LadyRanias.App/ClientApp/package-lock.json

    - name: Install
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

  # Container-image: bygges på hver PR. På main publiseres det også til Azure Container Registry.
  image:
    runs-on: ubuntu-latest
    needs: [build, frontend]   # bare hvis testene og frontend-bygget er grønne

    permissions:
      id-token: write   # lar jobben be GitHub om et OIDC-token til Azure-innloggingen
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Bygg image
      run: docker build -t ladyranias:${{ github.sha }} .

    - name: Logg inn i Azure (OIDC, uten passord)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    - name: Publiser til Azure Container Registry
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        az acr login --name ${{ vars.ACR_NAME }}
        docker tag ladyranias:${{ github.sha }} ${{ vars.ACR_LOGIN_SERVER }}/ladyranias:${{ github.sha }}
        docker tag ladyranias:${{ github.sha }} ${{ vars.ACR_LOGIN_SERVER }}/ladyranias:main
        docker push ${{ vars.ACR_LOGIN_SERVER }}/ladyranias:${{ github.sha }}
        docker push ${{ vars.ACR_LOGIN_SERVER }}/ladyranias:main

          - name: Deploy til test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name ${{ vars.CONTAINER_APP_TEST }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --image ${{ vars.ACR_LOGIN_SERVER }}/ladyranias:${{ github.sha }}